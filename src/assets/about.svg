  <!-- monogram text -->
  <text x="390" y="500" font-family="'Bebas Neue', sans-serif" font-size="160" letter-spacing="4" text-anchor="middle" fill="url(#textGrad)">NKS</text>

  <text x="390" y="700" font-family="'Montserrat', sans-serif" font-size="20" letter-spacing="6" text-anchor="middle" fill="#C4B29E">NITISH KUMAR SINGH</text>
